services:
  sql-lab:
    build:
      context: .
      dockerfile: infra/lab-runtime.Dockerfile
    command: npx tsx apps/sql-lab/src/index.ts
    environment:
      DATABASE_PATH: /data/sql.sqlite
    volumes:
      - sql-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - labs

  xss-lab:
    build:
      context: .
      dockerfile: infra/lab-runtime.Dockerfile
    command: npx tsx apps/xss-lab/src/index.ts
    environment:
      DATABASE_PATH: /data/xss.sqlite
    volumes:
      - xss-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - labs

  idor-lab:
    build:
      context: .
      dockerfile: infra/lab-runtime.Dockerfile
    command: npx tsx apps/idor-lab/src/index.ts
    environment:
      DATABASE_PATH: /data/idor.sqlite
    volumes:
      - idor-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - labs

  csrf-lab:
    build:
      context: .
      dockerfile: infra/lab-runtime.Dockerfile
    command: npx tsx apps/csrf-lab/src/index.ts
    environment:
      CSRF_ATTACKER_HOST_PORT: ${LAB_ATTACKER_HOST_PORT:-8081}
    expose:
      - "3000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - labs

  csrf-attacker:
    build:
      context: .
      dockerfile: infra/lab-runtime.Dockerfile
    command: npx tsx apps/csrf-attacker/src/index.ts
    environment:
      VICTIM_HOST_PORT: ${LAB_GATEWAY_HOST_PORT:-8080}
    expose:
      - "3000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - labs

  lab-console:
    build:
      context: .
      dockerfile: infra/lab-console.Dockerfile
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - labs

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${LAB_GATEWAY_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${LAB_ATTACKER_HOST_PORT:-8081}:8081"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sql-lab:
        condition: service_healthy
      xss-lab:
        condition: service_healthy
      idor-lab:
        condition: service_healthy
      csrf-lab:
        condition: service_healthy
      csrf-attacker:
        condition: service_healthy
      lab-console:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - edge
      - labs

networks:
  edge: {}
  labs:
    internal: true

volumes:
  sql-data:
  xss-data:
  idor-data:
