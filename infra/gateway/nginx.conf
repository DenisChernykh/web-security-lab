server {
  listen 8080;
  server_name _;

  location = /healthz {
    return 200 "ok\n";
  }

  location /api/sql/ {
    proxy_pass http://sql-lab:3000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }

  location /api/xss/ {
    proxy_pass http://xss-lab:3000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }

  location /api/idor/ {
    proxy_pass http://idor-lab:3000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }

  location /api/csrf/ {
    proxy_pass http://csrf-lab:3000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }

  location / {
    proxy_pass http://lab-console:8080;
  }
}

server {
  listen 8081;
  server_name _;

  location / {
    proxy_pass http://csrf-attacker:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }
}
