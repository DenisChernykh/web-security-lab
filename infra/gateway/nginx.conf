server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    return 200 "ok\n";
  }

  location /api/sql/ {
    set $sql_backend sql-lab;
    rewrite ^/api/sql/(.*)$ /$1 break;
    proxy_pass http://$sql_backend:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }

  location /api/xss/ {
    set $xss_backend xss-lab;
    rewrite ^/api/xss/(.*)$ /$1 break;
    proxy_pass http://$xss_backend:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }

  location /api/idor/ {
    set $idor_backend idor-lab;
    rewrite ^/api/idor/(.*)$ /$1 break;
    proxy_pass http://$idor_backend:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }

  location /api/csrf/ {
    set $csrf_backend csrf-lab;
    rewrite ^/api/csrf/(.*)$ /$1 break;
    proxy_pass http://$csrf_backend:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }

  location / {
    set $console_backend lab-console;
    proxy_pass http://$console_backend:8080;
  }
}

server {
  listen 8081;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $attacker_backend csrf-attacker;
    proxy_pass http://$attacker_backend:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
  }
}
